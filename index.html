<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكار الصباح والمساء</title>
<meta name="theme-color" content="#9A5A00">
<meta name="description" content="أذكار الصباح والمساء وأدعية مختارة، للقراءة والعدّ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأذكار">
<link rel="stylesheet" href="fonts.css">
<style>
:root {
  --bg: #EDF2F1;
  --card: #FFFFFF;
  --fg: #13232B;
  --muted: #3E555C;
  --line: #D2DDDC;
  --morning: #9A5A00;
  --on-morning: #FFFFFF;
  --evening: #3A55A3;
  --on-evening: #FFFFFF;
  --selected: #2D6A4F;
  --on-selected: #FFFFFF;
  --karb: #7A3E8E;
  --on-karb: #FFFFFF;
  --qiyam: #1F5F7A;
  --on-qiyam: #FFFFFF;
  --ruqya: #1A5C45;
  --on-ruqya: #FFFFFF;
  --salah: #9C3D54;
  --on-salah: #FFFFFF;
  --nawm: #34495E;
  --on-nawm: #FFFFFF;
  --accent: var(--morning);
  --on-accent: var(--on-morning);
  --f-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --f-title: "Reem Kufi", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --f-text: "Amiri", "Traditional Arabic", "Geeza Pro", "Noto Naskh Arabic", serif;
  --f-quran: "Amiri Quran", "Amiri", "Traditional Arabic", serif;
  color-scheme: light;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  height: 100%;
  direction: rtl;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
}
.app {
  height: 100%;
  width: min(720px, 100%);
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding-top: 8px;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
}
body[data-mode="evening"] { --accent: var(--evening); --on-accent: var(--on-evening); }
body[data-mode="selected"] { --accent: var(--selected); --on-accent: var(--on-selected); }
body[data-mode="karb"] { --accent: var(--karb); --on-accent: var(--on-karb); }
body[data-mode="qiyam"] { --accent: var(--qiyam); --on-accent: var(--on-qiyam); }
body[data-mode="ruqya"] { --accent: var(--ruqya); --on-accent: var(--on-ruqya); }
body[data-mode="salah"] { --accent: var(--salah); --on-accent: var(--on-salah); }
body[data-mode="nawm"] { --accent: var(--nawm); --on-accent: var(--on-nawm); }

button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.sticky {
  flex: none;
  z-index: 5;
  background: var(--bg);
  padding-bottom: 6px;
}
.seg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.seg button {
  flex: 1 1 calc(25% - 6px);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  min-width: 22%;
  padding: 6px 4px;
  border: 0;
  border-radius: 12px;
  background: color-mix(in srgb, var(--fg) 7%, var(--bg));
  color: var(--fg);
  font-weight: 600;
  font-size: .86rem;
  line-height: 1.2;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.prog { display: flex; align-items: center; gap: 10px; margin-top: 8px; color: var(--fg); font-size: .95rem; font-weight: 600; }
.prog .track { flex: 1; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.prog .track i { display: block; height: 100%; width: 0; background: var(--accent); }
.prog span { white-space: nowrap; font-variant-numeric: tabular-nums; }
.when { margin: 6px 0 0; font-size: .92rem; line-height: 1.55; font-weight: 600; color: var(--fg); text-align: center; }

.stage { position: relative; flex: 1; min-height: 0; }
.list {
  direction: ltr;
  height: 100%;
  overflow: hidden;
  touch-action: none;
}
.track {
  display: flex;
  flex-direction: row-reverse;
  height: 100%;
  width: 100%;
  will-change: transform;
}
.card {
  direction: rtl;
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  min-height: 0;
  touch-action: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 12px 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
}
.card.end { cursor: default; text-align: center; }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .95rem; color: var(--fg); }
.card-head .pos { font-variant-numeric: tabular-nums; font-weight: 600; }
.chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--accent); font-weight: 700; }
.only { margin-inline-start: auto; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent); font-weight: 700; }
.card h2 {
  margin: 0;
  font-family: var(--f-title);
  font-weight: 700;
  font-size: 1.35rem;
  line-height: 1.45;
  color: var(--accent);
  text-align: center;
  text-wrap: balance;
}
.read {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
}
.read-scroll {
  flex: 1;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  touch-action: pan-y;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 2px 2px 28px;
}
.text {
  margin: 0;
  font-family: var(--f-text);
  font-size: var(--reading, 1.6rem);
  line-height: 2.05;
  text-align: center;
  text-wrap: pretty;
  overflow-wrap: anywhere;
}
.text.q { font-family: var(--f-quran); line-height: 2.2; }
.text .line { unicode-bidi: isolate; transition: opacity .2s, color .2s; }
.text .line.cur { color: var(--accent); font-weight: 700; }
.text .line.past { opacity: .4; }
.text .paren {
  unicode-bidi: isolate;
  font-size: .72em;
  font-weight: 500;
  color: var(--muted);
}
.pre-note {
  margin: 0 0 10px;
  font-size: .98rem;
  line-height: 1.75;
  text-align: center;
  color: var(--fg);
  font-weight: 500;
}
.paren { unicode-bidi: isolate; }
.read .fade {
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: 46px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--card) 72%);
}
.read .fade[hidden] { display: none; }
.read .fade span {
  font-size: .85rem;
  font-weight: 700;
  color: var(--accent);
  padding-bottom: 4px;
}
.meta-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid var(--line);
  padding-top: 8px;
}
.meta {
  margin: 0;
  font-size: .98rem;
  line-height: 1.75;
  text-align: center;
  color: var(--fg);
  font-weight: 500;
}
.meta .k { font-weight: 700; color: var(--accent); }
.know { margin: 2px 0 0; text-align: right; }
.know .k { margin: 0 0 4px; font-weight: 700; color: var(--accent); font-size: .98rem; }
.know ul { margin: 0; padding: 0 1.15em 0 0; list-style: disc; }
.know li { margin: 0 0 4px; font-size: .95rem; line-height: 1.65; text-align: right; }

.foot { display: flex; flex-direction: column; gap: 8px; }
.mini { height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
.mini i { display: block; height: 100%; width: 0; background: var(--accent); }
.count {
  width: 100%;
  min-height: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 16px;
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.count .lbl { font-size: .85rem; }
.count .num { font-family: var(--f-title); font-weight: 700; font-size: 1.9rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.card.done .count, .count:disabled {
  background: color-mix(in srgb, var(--accent) 16%, var(--card));
  border-color: color-mix(in srgb, var(--accent) 45%, var(--card));
  color: var(--fg);
  cursor: default;
}
.bottom {
  flex: none;
  display: flex;
  flex-wrap: nowrap;
  gap: 4px;
  padding-top: 6px;
}
.bottom button {
  flex: 1 1 0;
  min-width: 0;
  min-height: 34px;
  padding: 2px 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
  font-weight: 700;
  font-size: 11px;
  line-height: 1.1;
  white-space: nowrap;
  cursor: pointer;
  touch-action: manipulation;
}
.bottom button:disabled { opacity: .4; cursor: default; }
.card.end .text { font-size: 1.35rem; }

.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-top: 6px;
}
.tools button {
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--fg);
  font-size: .95rem;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
.tools button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.tools button.armed { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
.tools button:disabled { opacity: .4; }

.sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: color-mix(in srgb, #000 48%, transparent);
  padding: 0;
}
.sheet[hidden] { display: none; }
.sheet-card {
  width: min(720px, 100%);
  max-height: min(82vh, 720px);
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 12px max(12px, env(safe-area-inset-bottom));
  background: var(--card);
  color: var(--fg);
  border-radius: 20px 20px 0 0;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { margin: 0; font-family: var(--f-title); font-size: 1.25rem; color: var(--accent); }
.sheet-head button, .sheet-list button {
  min-height: 44px;
  border-radius: 12px;
  cursor: pointer;
  touch-action: manipulation;
}
.sheet-head button {
  padding: 0 14px;
  border: 1px solid var(--line);
  background: transparent;
  font-weight: 700;
}
.sheet-list { overflow: auto; margin: 0; padding: 0; list-style: none; }
.sheet-list button {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: right;
  font-weight: 600;
  font-size: 1rem;
}
.sheet-list button .st { color: var(--accent); font-weight: 700; white-space: nowrap; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 30;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--fg);
  color: var(--bg);
  font-weight: 700;
}
.toast[hidden] { display: none; }
.geo-ask {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 40;
  max-width: 520px;
  margin: 0 auto;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  color: var(--fg);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
}
.geo-ask p { margin: 0 0 10px; line-height: 1.7; font-size: .98rem; }
.geo-ask .row { display: flex; gap: 8px; }
.geo-ask button {
  flex: 1;
  min-height: 44px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.geo-ask button.yes { background: var(--accent); color: var(--on-accent, #fff); border-color: transparent; }
.nav-row {
  display: none;
  gap: 8px;
  margin-top: 6px;
}
.nav-row button {
  flex: 1;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--fg);
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
}
.nav-row button:disabled { opacity: .35; cursor: default; }
@media (min-width: 700px) {
  .nav-row { display: flex; }
}
@media (min-width: 700px) {
  .sheet { align-items: center; padding: 24px; }
  .sheet-card { border-radius: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<h1 class="sr">أذكار الصباح والمساء</h1>
<div class="app">
  <div class="sticky">
    <div class="seg" role="group" aria-label="أقسام الأذكار">
      <button type="button" id="b-m" aria-pressed="true">الصباح</button>
      <button type="button" id="b-e" aria-pressed="false">المساء</button>
      <button type="button" id="b-p" aria-pressed="false">بعد الصلاة</button>
      <button type="button" id="b-n" aria-pressed="false">قبل النوم</button>
      <button type="button" id="b-s" aria-pressed="false">أدعية مختارة</button>
      <button type="button" id="b-k" aria-pressed="false">أدعية الكرب</button>
      <button type="button" id="b-q" aria-pressed="false">قيام الليل</button>
      <button type="button" id="b-r" aria-pressed="false">الرقية الشرعية</button>
    </div>
    <div class="prog" aria-live="polite">
      <div class="track"><i id="bar"></i></div>
      <span id="prog-txt"></span>
    </div>
    <div class="nav-row">
      <button type="button" id="nav-prev">السابق</button>
      <button type="button" id="nav-next">التالي</button>
    </div>
  </div>
  <div class="stage">
    <div class="list" id="car" aria-label="الأذكار" tabindex="0"></div>
  </div>
  <div class="bottom" id="bottom">
    <button type="button" id="t-minus" aria-label="تصغير الخط">أ−</button>
    <button type="button" id="t-plus" aria-label="تكبير الخط">أ+</button>
    <button type="button" id="b-undo">تراجع</button>
    <button type="button" id="b-reset">إعادة</button>
    <button type="button" id="b-copy">نسخ</button>
    <button type="button" id="b-share">مشاركة</button>
  </div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function () {
  document.documentElement.lang = "ar";
  document.documentElement.dir = "rtl";

  var DIG = "٠١٢٣٤٥٦٧٨٩";
  function ar(n) { return String(n).replace(/\d/g, function (d) { return DIG[d]; }); }
  function two(n) { return ar(n < 10 ? "0" + n : String(n)); }
  function times(n) {
    if (n === 1) return "مرة واحدة";
    if (n === 2) return "مرتان";
    return n <= 10 ? ar(n) + " مرات" : ar(n) + " مرة";
  }

  var MODE_NAME = { m: "أذكار الصباح", e: "أذكار المساء", s: "أدعية مختارة", k: "أدعية الكرب", q: "قيام الليل", r: "الرقية الشرعية" };
  var DONE_MSG = {
    m: "تقبّل الله منك. أتممت أذكار الصباح بحمد الله.",
    e: "تقبّل الله منك. أتممت أذكار المساء بحمد الله.",
    s: "تقبّل الله منك. أتممت الأدعية المختارة بحمد الله.",
    k: "تقبّل الله منك. أتممت أدعية الكرب بحمد الله.",
    q: "تقبّل الله منك. أتممت دعاء قيام الليل بحمد الله.",
    r: "تقبّل الله منك. أتممت الرقية الشرعية بحمد الله.",
    p: "تقبّل الله منك. أتممت أذكار ما بعد الصلاة بحمد الله.",
    n: "تقبّل الله منك. أتممت أذكار النوم بحمد الله. نوم هنيء."
  };

  /* when: b = صباح ومساء، m = الصباح فقط، e = المساء فقط، s/k/q/r/p/n أقسام مستقلة. span=day عدّاد واحد لليوم. */
  var ITEMS = [
  {
    "id": "kursi",
    "kind": "q",
    "when": "b",
    "count": 1,
    "title": "آية الكرسي",
    "text": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾",
    "ref": "البقرة · الآية ٢٥٥",
    "note": "ثبت فضلها بعد الصلاة وعند النوم (البخاري). وتخصيصها بالصباح والمساء: حديث الترمذي ٢٨٧٩ ضعيف. ودليل التخصيص الآخر حديث أُبيّ بن كعب في قصة الجني: من قرأها غدوةً أُجير من الجن حتى يمسي، ومن قرأها حين يمسي أُجير حتى يصبح. رواه النسائي في الكبرى، وقال الحاكم: «صحيح الإسناد»."
  },
  {
    "id": "ikhlas",
    "kind": "q",
    "when": "b",
    "count": 3,
    "title": "سورة الإخلاص",
    "text": "قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾",
    "ref": "الإخلاص · الآيات ١–٤",
    "note": "أبو داود ٥٠٨٢ (مع المعوذتين ثلاثًا) وحكمه: حسن."
  },
  {
    "id": "falaq",
    "kind": "q",
    "when": "b",
    "count": 3,
    "title": "سورة الفلق",

  /* Asr, Umm al-Qura: standard shadow factor 1. Local computation, no network. */
  function dtr(d) { return d * Math.PI / 180; }
  function rtd(r) { return r * 180 / Math.PI; }
  function sinD(d) { return Math.sin(dtr(d)); }
  function cosD(d) { return Math.cos(dtr(d)); }
  function tanD(d) { return Math.tan(dtr(d)); }
  function arcsin(x) { return rtd(Math.asin(x)); }
  function arccos(x) { return rtd(Math.acos(Math.max(-1, Math.min(1, x)))); }
  function arccot(x) { return rtd(Math.atan(1 / x)); }
  function fix(a, b) { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; }
  function julian(year, month, day) {
    if (month <= 2) { year -= 1; month += 12; }
    var A = Math.floor(year / 100);
    var B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
  }
  function sunPosition(jd) {
    var D = jd - 2451545.0;
    var g = fix(357.529 + 0.98560028 * D, 360);
    var q = fix(280.459 + 0.98564736 * D, 360);
    var L = fix(q + 1.915 * sinD(g) + 0.020 * sinD(2 * g), 360);
    var e = 23.439 - 0.00000036 * D;
    var RA = rtd(Math.atan2(cosD(e) * sinD(L), cosD(L))) / 15;
    return [arcsin(sinD(e) * sinD(L)), q / 15 - fix(RA, 24)];
  }
  function asrOn(lat, lng, date) {
    if (Math.abs(lat) > 64) return null;
    var tz = -date.getTimezoneOffset() / 60;
    var jdate = julian(date.getFullYear(), date.getMonth() + 1, date.getDate()) - lng / (15 * 24);
    function sunAngle(angle, t) {
      var sp = sunPosition(jdate + t);
      var noon = fix(12 - sp[1], 24);
      var denom = cosD(sp[0]) * cosD(lat);
      if (Math.abs(denom) < 1e-6) return null;
      var h = 1 / 15 * arccos((-sinD(angle) - sinD(sp[0]) * sinD(lat)) / denom);

      t = next / 24;

    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setHours(0, 0, 0, 0);
    d.setTime(d.getTime() + hours * 3600000);

  }

  /* Multi-phase card (e.g. tasbih 10 then tahmid 10 then takbir 10): one

    document.getElementById("t-plus").disabled = S.size === SIZES.length - 1;
  }
  document.getElementById("t-minus").addEventListener("click", function () { if (S.size > 0) { S.size--; save(); applySize(); } });
  document.getElementById("t-plus").addEventListener("click", function () { if (S.size < SIZES.length - 1) { S.size++; save(); applySize(); } });
  document.getElementById("b-undo").addEventListener("click", function () { var it = currentItem(); if (it) untap(it); });
  document.getElementById("b-reset").addEventListener("click", function () { var it = currentItem(); if (it) resetItem(it); });
  document.getElementById("b-copy").addEventListener("click", function () { var it = currentItem(); if (it) copyText(plain(it)); });
  document.getElementById("b-share").addEventListener("click", function () {
    var it = currentItem();
    if (!it) return;
    var text = plain(it);
    if (navigator.share) {
      navigator.share({ title: it.title, text: text }).catch(function (err) {
        if (err && err.name === "AbortError") return;
        copyText(text);
      });
    } else copyText(text);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { e.preventDefault(); go(cur + 1, true); }
    else if (e.key === "ArrowRight") { e.preventDefault(); go(cur - 1, true); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      var sc = cards[cur] && cards[cur].querySelector(".read-scroll");
      if (!sc) return;
      e.preventDefault();
      sc.scrollBy({ top: e.key === "ArrowDown" ? 72 : -72, behavior: smooth ? "smooth" : "auto" });
    }
  });
  document.getElementById("nav-next").addEventListener("click", function () { go(cur + 1, true); });
  document.getElementById("nav-prev").addEventListener("click", function () { go(cur - 1, true); });
  window.addEventListener("resize", function () {
    place(cur * (car.clientWidth || 0), false);
    refreshMore();
  });
  bindSwipe();

  function locate() {
    navigator.geolocation.getCurrentPosition(function (pos) {
      geo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      try { localStorage.setItem("adhkar-geo", JSON.stringify(geo)); } catch (err) {}
      var info = clockInfo();
      if (!userPicked && (mode === "m" || mode === "e") && info.mode !== mode) setMode(info.mode);
    }, function () {}, { enableHighAccuracy: false, maximumAge: 6 * 3600 * 1000, timeout: 8000 });
  }
  /* Explain why before the browser asks. Ask once; a saved location means it
     was already allowed, so refresh it quietly. */
  function askGeo() {
    var box = el("div", "geo-ask");
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-label", "استخدام الموقع");
    box.appendChild(el("p", "", "يحسب التطبيق وقت العصر من موقعك ليبدأ أذكار المساء تلقائيًا بعده. الموقع يبقى في جوالك ولا يُرسل لأي جهة. وبدونه يبدأ المساء الساعة ٣ العصر."));
    var row = el("div", "row");
    var yes = el("button", "yes", "سماح"); yes.type = "button";
    var no = el("button", "", "لاحقًا"); no.type = "button";
    function close(v) {
      try { localStorage.setItem("adhkar-geo-asked", v); } catch (err) {}
      box.remove();
    }
    yes.addEventListener("click", function () { close("yes"); locate(); });
    no.addEventListener("click", function () { close("later"); });
    row.appendChild(yes); row.appendChild(no);
    box.appendChild(row);
    document.body.appendChild(box);
  }
  if (navigator.geolocation) {
    var askedGeo = null;
    try { askedGeo = localStorage.getItem("adhkar-geo-asked"); } catch (err) {}
    if (geo || askedGeo === "yes") locate();
    else if (!askedGeo) askGeo();
  }

  applySize();
  setMode(mode);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
