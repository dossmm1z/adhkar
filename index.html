<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكار الصباح والمساء</title>
<meta name="theme-color" content="#9A5A00">
<meta name="description" content="أذكار الصباح والمساء وأدعية مختارة، للقراءة والعدّ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأذكار">
<link rel="stylesheet" href="fonts.css">
<script>
try {
  var th = localStorage.getItem("adhkar-theme");
  if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
} catch (e) {}
</script>
<style>
:root {
  --bg: #EDF2F1;
  --card: #FFFFFF;
  --fg: #13232B;
  --muted: #3E555C;
  --line: #D2DDDC;
  --morning: #9A5A00;
  --on-morning: #FFFFFF;
  --evening: #3A55A3;
  --on-evening: #FFFFFF;
  --selected: #2D6A4F;
  --on-selected: #FFFFFF;
  --karb: #7A3E8E;
  --on-karb: #FFFFFF;
  --qiyam: #1F5F7A;
  --on-qiyam: #FFFFFF;
  --accent: var(--morning);
  --on-accent: var(--on-morning);
  --f-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --f-title: "Reem Kufi", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --f-text: "Amiri", "Traditional Arabic", "Geeza Pro", "Noto Naskh Arabic", serif;
  --f-quran: "Amiri Quran", "Amiri", "Traditional Arabic", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D191E;
    --card: #15262D;
    --fg: #E7F0EF;
    --muted: #C5D6DA;
    --line: #264049;
    --morning: #E6A94A;
    --on-morning: #1B1204;
    --evening: #8EA8F2;
    --on-evening: #0C1330;
    --selected: #7CC4A0;
    --on-selected: #0A1F15;
    --karb: #C9A0DC;
    --on-karb: #1F0F28;
    --qiyam: #6FC3E0;
    --on-qiyam: #08202B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D191E;
  --card: #15262D;
  --fg: #E7F0EF;
  --muted: #C5D6DA;
  --line: #264049;
  --morning: #E6A94A;
  --on-morning: #1B1204;
  --evening: #8EA8F2;
  --on-evening: #0C1330;
  --selected: #7CC4A0;
  --on-selected: #0A1F15;
  --karb: #C9A0DC;
  --on-karb: #1F0F28;
  --qiyam: #6FC3E0;
  --on-qiyam: #08202B;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

html { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  min-height: 100%;
  direction: rtl;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
.app {
  width: min(720px, 100%);
  margin-inline: auto;
  padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body[data-mode="evening"] { --accent: var(--evening); --on-accent: var(--on-evening); }
body[data-mode="selected"] { --accent: var(--selected); --on-accent: var(--on-selected); }
body[data-mode="karb"] { --accent: var(--karb); --on-accent: var(--on-karb); }
body[data-mode="qiyam"] { --accent: var(--qiyam); --on-accent: var(--on-qiyam); }

button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.sticky {
  position: sticky;
  top: 0;
  z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  padding-bottom: 8px;
}
.seg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.seg button {
  flex: 1 1 calc(33.33% - 6px);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  min-width: 30%;
  padding: 6px 8px;
  border: 0;
  border-radius: 12px;
  background: color-mix(in srgb, var(--fg) 7%, var(--bg));
  color: var(--fg);
  font-weight: 600;
  font-size: .92rem;
  line-height: 1.25;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.prog { display: flex; align-items: center; gap: 10px; margin-top: 8px; color: var(--fg); font-size: .95rem; font-weight: 600; }
.prog .track { flex: 1; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.prog .track i { display: block; height: 100%; width: 0; background: var(--accent); }
.prog span { white-space: nowrap; font-variant-numeric: tabular-nums; }
.when { margin: 6px 0 0; font-size: .92rem; line-height: 1.55; font-weight: 600; color: var(--fg); text-align: center; }

.list { display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px; }
.card {
  scroll-margin-top: calc(var(--stick, 220px) + 8px);
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px 16px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  cursor: pointer;
}
.card.end { cursor: default; text-align: center; }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .95rem; color: var(--fg); }
.card-head .pos { font-variant-numeric: tabular-nums; font-weight: 600; }
.chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--accent); font-weight: 700; }
.only { margin-inline-start: auto; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent); font-weight: 700; }
.card h2 {
  margin: 0;
  font-family: var(--f-title);
  font-weight: 700;
  font-size: 1.35rem;
  line-height: 1.45;
  color: var(--accent);
  text-align: center;
  text-wrap: balance;
}
.text {
  margin: 0;
  padding: 4px 2px 8px;
  font-family: var(--f-text);
  font-size: var(--reading, 1.6rem);
  line-height: 2.05;
  text-align: center;
  text-wrap: pretty;
  overflow-wrap: anywhere;
}
.text.q { font-family: var(--f-quran); line-height: 2.2; }
.meta-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid var(--line);
  padding-top: 8px;
}
.meta {
  margin: 0;
  font-size: .98rem;
  line-height: 1.75;
  text-align: center;
  color: var(--fg);
  font-weight: 500;
}
.meta .k { font-weight: 700; color: var(--accent); }

.foot { display: flex; flex-direction: column; gap: 8px; }
.mini { height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
.mini i { display: block; height: 100%; width: 0; background: var(--accent); }
.count {
  width: 100%;
  min-height: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 16px;
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.count .lbl { font-size: .85rem; }
.count .num { font-family: var(--f-title); font-weight: 700; font-size: 1.9rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.card.done .count, .count:disabled {
  background: color-mix(in srgb, var(--accent) 16%, var(--card));
  border-color: color-mix(in srgb, var(--accent) 45%, var(--card));
  color: var(--fg);
  cursor: default;
}
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.act {
  flex: 1 1 calc(50% - 8px);
  min-height: 44px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: transparent;
  color: var(--fg);
  font-weight: 600;
  font-size: .95rem;
  cursor: pointer;
  touch-action: manipulation;
}
.act:disabled { opacity: .4; cursor: default; }
.card.end .text { font-size: 1.35rem; }

.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-top: 8px;
}
.tools button {
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--fg);
  font-size: .95rem;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
.tools button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.tools button.armed { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
.tools button:disabled { opacity: .4; }

.sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: color-mix(in srgb, #000 48%, transparent);
  padding: 0;
}
.sheet[hidden] { display: none; }
.sheet-card {
  width: min(720px, 100%);
  max-height: min(82vh, 720px);
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 12px max(12px, env(safe-area-inset-bottom));
  background: var(--card);
  color: var(--fg);
  border-radius: 20px 20px 0 0;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { margin: 0; font-family: var(--f-title); font-size: 1.25rem; color: var(--accent); }
.sheet-head button, .sheet-list button {
  min-height: 44px;
  border-radius: 12px;
  cursor: pointer;
  touch-action: manipulation;
}
.sheet-head button {
  padding: 0 14px;
  border: 1px solid var(--line);
  background: transparent;
  font-weight: 700;
}
.sheet-list { overflow: auto; margin: 0; padding: 0; list-style: none; }
.sheet-list button {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  text-align: right;
  font-weight: 600;
  font-size: 1rem;
}
.sheet-list button .st { color: var(--accent); font-weight: 700; white-space: nowrap; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 30;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--fg);
  color: var(--bg);
  font-weight: 700;
}
.toast[hidden] { display: none; }
@media (min-width: 700px) {
  .sheet { align-items: center; padding: 24px; }
  .sheet-card { border-radius: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<h1 class="sr">أذكار الصباح والمساء</h1>
<div class="app">
  <div class="sticky">
    <div class="seg" role="group" aria-label="أقسام الأذكار">
      <button type="button" id="b-m" aria-pressed="true">الصباح</button>
      <button type="button" id="b-e" aria-pressed="false">المساء</button>
      <button type="button" id="b-s" aria-pressed="false">أدعية مختارة</button>
      <button type="button" id="b-k" aria-pressed="false">أدعية الكرب</button>
      <button type="button" id="b-q" aria-pressed="false">قيام الليل</button>
    </div>
    <div class="prog" aria-live="polite">
      <div class="track"><i id="bar"></i></div>
      <span id="prog-txt"></span>
    </div>
    <p id="when-note" class="when"></p>
    <div class="tools">
      <button type="button" id="t-minus" aria-label="تصغير الخط">أ −</button>
      <button type="button" id="t-plus" aria-label="تكبير الخط">أ +</button>
      <button type="button" id="t-auto" aria-pressed="true">تقدّم تلقائي</button>
      <button type="button" id="t-index" aria-expanded="false">الفهرس</button>
      <button type="button" id="t-theme" aria-pressed="false">الوضع الليلي</button>
      <button type="button" id="t-reset">إعادة القسم</button>
    </div>
  </div>
  <div class="list" id="car" aria-label="الأذكار"></div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">الفهرس</h2>
      <button type="button" id="sheet-close">إغلاق</button>
    </div>
    <ul class="sheet-list" id="sheet-list"></ul>
  </div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function () {
  document.documentElement.lang = "ar";
  document.documentElement.dir = "rtl";

  var DIG = "٠١٢٣٤٥٦٧٨٩";
  function ar(n) { return String(n).replace(/\d/g, function (d) { return DIG[d]; }); }
  function two(n) { return ar(n < 10 ? "0" + n : String(n)); }
  function times(n) {
    if (n === 1) return "مرة واحدة";
    if (n === 2) return "مرتان";
    return n <= 10 ? ar(n) + " مرات" : ar(n) + " مرة";
  }

  var MODE_NAME = { m: "أذكار الصباح", e: "أذكار المساء", s: "أدعية مختارة", k: "أدعية الكرب", q: "قيام الليل" };
  var DONE_MSG = {
    m: "تقبّل الله منك. أتممت أذكار الصباح بحمد الله.",
    e: "تقبّل الله منك. أتممت أذكار المساء بحمد الله.",
    s: "تقبّل الله منك. أتممت الأدعية المختارة بحمد الله.",
    k: "تقبّل الله منك. أتممت أدعية الكرب بحمد الله.",
    q: "تقبّل الله منك. أتممت دعاء قيام الليل بحمد الله."
  };

  /* when: b = صباح ومساء، m = الصباح فقط، e = المساء فقط، s/k/q أقسام مستقلة. span=day عدّاد واحد لليوم. */
  var ITEMS = [
  {
    "id": "kursi",
    "kind": "q",
    "when": "b",
    "count": 1,
    "title": "آية الكرسي",
    "text": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾",
    "ref": "البقرة · الآية ٢٥٥",
    "note": "ثبت فضلها بعد الصلاة وعند النوم (البخاري). وتخصيصها بالصباح والمساء: حديث الترمذي ٢٨٧٩ ضعيف. ودليل التخصيص الآخر حديث أُبيّ بن كعب في قصة الجني: من قرأها غدوةً أُجير من الجن حتى يمسي، ومن قرأها حين يمسي أُجير حتى يصبح. رواه النسائي في الكبرى، وقال الحاكم: «صحيح الإسناد»."
  },
  {
    "id": "ikhlas",
    "kind": "q",
    "when": "b",
    "count": 3,
    "title": "سورة الإخلاص",
    "text": "قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾",
    "ref": "الإخلاص · الآيات ١–٤",
    "note": "أبو داود ٥٠٨٢ (مع المعوذتين ثلاثًا) وحكمه: حسن."
  },
  {
    "id": "falaq",
    "kind": "q",
    "when": "b",
    "count": 3,
    "title": "سورة الفلق",
    "text": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾",
    "ref": "الفلق · الآيات ١–٥",
    "note": "تُقرأ مع الإخلاص والناس ثلاثًا. أبو داود ٥٠٨٢، وحكمه: حسن."
  },
  {
    "id": "nas",
    "kind": "q",
    "when": "b",
    "count": 3,
    "title": "سورة الناس",
    "text": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾",
    "ref": "الناس · الآيات ١–٦",
    "note": "تُقرأ مع الإخلاص والفلق ثلاثًا. أبو داود ٥٠٨٢، وحكمه: حسن."
  },
  {
    "id": "baqara",
    "kind": "q",
    "when": "e",

    if (saved && typeof saved === "object") {
      if (typeof saved.size === "number") S.size = Math.max(0, Math.min(SIZES.length - 1, saved.size));
      if (typeof saved.auto === "boolean") S.auto = saved.auto;
      if (saved.day === S.day) {
        S.m = saved.m || {}; S.e = saved.e || {}; S.s = saved.s || {};
        S.k = saved.k || {}; S.q = saved.q || {}; S.shared = saved.shared || {};
      }
    }
  } catch (err) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (err) {} }

  /* Asr, Umm al-Qura: standard shadow factor 1. Local computation, no network. */
  function dtr(d) { return d * Math.PI / 180; }
  function rtd(r) { return r * 180 / Math.PI; }
  function sinD(d) { return Math.sin(dtr(d)); }
  function cosD(d) { return Math.cos(dtr(d)); }
  function tanD(d) { return Math.tan(dtr(d)); }
  function arcsin(x) { return rtd(Math.asin(x)); }
  function arccos(x) { return rtd(Math.acos(Math.max(-1, Math.min(1, x)))); }
  function arccot(x) { return rtd(Math.atan(1 / x)); }
  function fix(a, b) { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; }
  function julian(year, month, day) {
    if (month <= 2) { year -= 1; month += 12; }
    var A = Math.floor(year / 100);
    var B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
  }
  function sunPosition(jd) {
    var D = jd - 2451545.0;
    var g = fix(357.529 + 0.98560028 * D, 360);
    var q = fix(280.459 + 0.98564736 * D, 360);
    var L = fix(q + 1.915 * sinD(g) + 0.020 * sinD(2 * g), 360);
    var e = 23.439 - 0.00000036 * D;
    var RA = rtd(Math.atan2(cosD(e) * sinD(L), cosD(L))) / 15;
    return [arcsin(sinD(e) * sinD(L)), q / 15 - fix(RA, 24)];
  }
  function asrOn(lat, lng, date) {
    if (Math.abs(lat) > 64) return null;
    var tz = -date.getTimezoneOffset() / 60;
    var jdate = julian(date.getFullYear(), date.getMonth() + 1, date.getDate()) - lng / (15 * 24);
    function sunAngle(angle, t) {
      var sp = sunPosition(jdate + t);
      var noon = fix(12 - sp[1], 24);
      var denom = cosD(sp[0]) * cosD(lat);
      if (Math.abs(denom) < 1e-6) return null;
      var h = 1 / 15 * arccos((-sinD(angle) - sinD(sp[0]) * sinD(lat)) / denom);
      return noon + h;
    }
    var t = 13 / 24, i, decl, angle, next;
    for (i = 0; i < 3; i++) {
      decl = sunPosition(jdate + t)[0];
      angle = -arccot(1 + tanD(Math.abs(lat - decl)));
      next = sunAngle(angle, t);
      if (next == null || !isFinite(next)) return null;
      t = next / 24;
    }
    var hours = t * 24 + tz - lng / 15;
    if (!isFinite(hours)) return null;
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setHours(0, 0, 0, 0);
    d.setTime(d.getTime() + hours * 3600000);
    return d;
  }

  var geo = null;
  try {
    var g = JSON.parse(localStorage.getItem("adhkar-geo") || "null");
    if (g && typeof g.lat === "number" && typeof g.lng === "number") geo = g;
  } catch (err) {}

  function clockInfo(now) {
    now = now || new Date();
    var asr = null;
    if (geo) { try { asr = asrOn(geo.lat, geo.lng, now); } catch (err) { asr = null; } }
    if (asr) return { mode: now < asr ? "m" : "e", how: "asr", asr: asr };
    return { mode: now.getHours() < 15 ? "m" : "e", how: "hour", asr: null };
  }
  function paintWhen(info) {
    var el = document.getElementById("when-note");
    if (!el) return;
    if (info.how === "asr") {
      el.textContent = (info.mode === "m" ? "صباح حتى العصر " : "مساء بعد العصر ") + two(info.asr.getHours()) + ":" + two(info.asr.getMinutes()) + " (أم القرى)";
    } else {
      el.textContent = "قبل الثالثة عصرًا: صباح، وبعدها: مساء";
    }
  }

  var userPicked = false;
  var info0 = clockInfo();
  var mode = info0.mode;
  var list = [], cards = [], cur = 0;
  var car = document.getElementById("car");
  var smooth = !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  var sheet = document.getElementById("sheet");

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function storeOf(it) { return it.span === "day" ? S.shared : S[mode]; }
  function doneOf(it) { return Math.min(storeOf(it)[it.id] || 0, it.count); }
  function isFin(it) { return doneOf(it) >= it.count; }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (err) {} }
  function rawText(it) { return typeof it.text === "string" ? it.text : it.text[mode]; }
  function plain(it) {
    var parts = [it.title, rawText(it)];
    if (it.ref) parts.push(it.ref);
    if (it.note) parts.push(it.note);
    return parts.join("\n\n");
  }
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.hidden = false;
    t.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 1600);
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { toast(document.execCommand("copy") ? "تم النسخ" : "تعذّر النسخ"); }
      catch (err) { toast("تعذّر النسخ"); }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("تم النسخ"); }, fallback);
    } else fallback();
  }

  function build() {
    list = ITEMS.filter(function (it) {
      return it.when === mode || ((mode === "m" || mode === "e") && it.when === "b");
    });
    car.textContent = "";
    cards = [];
    var total = list.length;

    list.forEach(function (it, i) {
      var card = el("article", "card");
      card.id = "item-" + it.id;
      card.setAttribute("aria-label", it.title);

      var head = el("div", "card-head");
      head.appendChild(el("span", "pos", ar(i + 1) + " / " + ar(total)));
      head.appendChild(el("span", "chip", it.span === "day" ? "مائة مرة في اليوم" : times(it.count)));
      if (it.when === "m" || it.when === "e") head.appendChild(el("span", "only", it.when === "m" ? "للصباح فقط" : "للمساء فقط"));
      card.appendChild(head);
      card.appendChild(el("h2", "", it.title));

      var raw = rawText(it);
      card.appendChild(el("p", "text" + (it.kind === "q" ? " q" : ""), it.kind === "q" ? raw : "«" + raw + "»"));

      if (it.ref || it.note) {
        var meta = el("div", "meta-wrap");
        if (it.ref) {
          var r = el("p", "meta");
          r.appendChild(el("span", "k", "المصدر: "));
          r.appendChild(document.createTextNode(it.ref));
          meta.appendChild(r);
        }
        if (it.note) {
          var nte = el("p", "meta");
          nte.appendChild(el("span", "k", "البيان: "));
          nte.appendChild(document.createTextNode(it.note));
          meta.appendChild(nte);
        }
        card.appendChild(meta);
      }

      var foot = el("div", "foot");
      var mini = el("div", "mini"); mini.appendChild(document.createElement("i"));
      var btn = el("button", "count"); btn.type = "button";
      btn.appendChild(el("span", "lbl")); btn.appendChild(el("span", "num"));
      var acts = el("div", "acts");
      var undo = el("button", "act", "تراجع"); undo.type = "button"; undo.setAttribute("data-stop", "");
      var reset = el("button", "act", "إعادة الذكر"); reset.type = "button"; reset.setAttribute("data-stop", "");
      var copy = el("button", "act", "نسخ"); copy.type = "button"; copy.setAttribute("data-stop", "");
      var share = el("button", "act", "مشاركة"); share.type = "button"; share.setAttribute("data-stop", "");
      acts.appendChild(undo); acts.appendChild(reset); acts.appendChild(copy); acts.appendChild(share);
      foot.appendChild(mini); foot.appendChild(btn); foot.appendChild(acts);
      card.appendChild(foot);

      card.addEventListener("click", function (e) {
        if (e.target.closest("[data-stop]")) return;
        if (window.getSelection && String(window.getSelection())) return;
        tap(it, i);
      });
      undo.addEventListener("click", function (e) { e.stopPropagation(); untap(it); });
      reset.addEventListener("click", function (e) { e.stopPropagation(); resetItem(it); });
      copy.addEventListener("click", function (e) { e.stopPropagation(); copyText(plain(it)); });
      share.addEventListener("click", function (e) {
        e.stopPropagation();
        var text = plain(it);
        if (navigator.share) {
          navigator.share({ title: it.title, text: text }).catch(function (err) {
            if (err && err.name === "AbortError") return;
            copyText(text);
          });
        } else copyText(text);
      });

      car.appendChild(card);
      cards.push(card);
      paint(i);
    });

    var end = el("article", "card end");
    end.setAttribute("aria-label", "الختام");
    end.appendChild(el("h2", "", "الختام"));
    var et = el("p", "text", ""); et.id = "end-text";
    end.appendChild(et);
    var eb = el("button", "count"); eb.type = "button"; eb.id = "end-btn";
    eb.appendChild(el("span", "num", "أول ذكر ناقص"));
    eb.addEventListener("click", function () { go(firstOpen(), true); });
    end.appendChild(eb);
    car.appendChild(end);
    cards.push(end);
    progress();
  }

  function paint(i) {
    var it = list[i], card = cards[i];
    if (!it || !card) return;
    var d = doneOf(it), fin = d >= it.count;
    var btn = card.querySelector(".count");
    var undo = card.querySelector(".acts .act");
    var reset = card.querySelectorAll(".acts .act")[1];
    var lbl = btn.querySelector(".lbl"), num = btn.querySelector(".num");
    card.classList.toggle("done", fin);
    card.querySelector(".mini i").style.width = (d / it.count * 100) + "%";
    btn.disabled = fin;
    undo.disabled = d === 0;
    reset.disabled = d === 0;
    if (fin) {
      lbl.textContent = ""; lbl.hidden = true; num.textContent = "✓ تمّت";
    } else if (it.count === 1) {
      lbl.hidden = false; lbl.textContent = "اضغط بعد القراءة"; num.textContent = "تمّت";
    } else {
      lbl.hidden = false; lbl.textContent = "المتبقي من " + ar(it.count); num.textContent = ar(it.count - d);
    }
  }

  function progress() {
    var total = list.length, n = list.filter(isFin).length;
    document.getElementById("bar").style.width = (total ? n / total * 100 : 0) + "%";
    document.getElementById("prog-txt").textContent = "اكتمل " + ar(n) + " من " + ar(total);
    var rem = total - n;
    var et = document.getElementById("end-text"), eb = document.getElementById("end-btn");
    if (!et) return;
    if (rem === 0) { et.textContent = DONE_MSG[mode]; eb.hidden = true; }
    else { et.textContent = "لم يكتمل بعد: " + ar(rem) + " من " + ar(total); eb.hidden = false; }
  }

  function firstOpen() {
    for (var i = 0; i < list.length; i++) if (!isFin(list[i])) return i;
    return list.length;
  }
  function go(i, sm) {
    i = Math.max(0, Math.min(cards.length - 1, i));
    cur = i;
    cards[i].scrollIntoView({ behavior: sm && smooth ? "smooth" : "auto", block: "start" });
  }
  function updateCur() {
    var mark = window.scrollY + 210;
    var best = 0;
    for (var i = 0; i < cards.length; i++) if (cards[i].offsetTop <= mark) best = i;
    cur = best;
  }

  function tap(it, i) {
    var d = doneOf(it);
    if (d >= it.count) return;
    storeOf(it)[it.id] = d + 1;
    save(); paint(i); progress();
    if (d + 1 >= it.count) {
      buzz([12, 40, 12]);
      if (S.auto) setTimeout(function () { if (cur === i) go(i + 1, true); }, 380);
    } else buzz(12);
  }
  function untap(it) {
    var d = doneOf(it);
    if (d <= 0) return;
    storeOf(it)[it.id] = d - 1;
    save(); paint(list.indexOf(it)); progress();
  }
  function resetItem(it) {
    storeOf(it)[it.id] = 0;
    save(); paint(list.indexOf(it)); progress();
  }

  function setMode(m, startAt) {
    mode = m;
    document.body.setAttribute("data-mode", m === "e" ? "evening" : m === "s" ? "selected" : m === "k" ? "karb" : m === "q" ? "qiyam" : "morning");
    ["m", "e", "s", "k", "q"].forEach(function (k) {
      document.getElementById("b-" + k).setAttribute("aria-pressed", String(m === k));
    });
    build();
    paintWhen(clockInfo());
    syncStick();
    requestAnimationFrame(function () { go(startAt == null ? firstOpen() : startAt, false); });
  }
  function syncStick() {
    var bar = document.querySelector(".sticky");
    if (bar) document.documentElement.style.setProperty("--stick", bar.offsetHeight + "px");
  }
  ["m", "e", "s", "k", "q"].forEach(function (k) {
    document.getElementById("b-" + k).addEventListener("click", function () {
      userPicked = true;
      if (mode !== k) setMode(k);
    });
  });

  function applySize() {
    document.documentElement.style.setProperty("--reading", SIZES[S.size] + "rem");
    document.getElementById("t-minus").disabled = S.size === 0;
    document.getElementById("t-plus").disabled = S.size === SIZES.length - 1;
  }
  document.getElementById("t-minus").addEventListener("click", function () { if (S.size > 0) { S.size--; save(); applySize(); } });
  document.getElementById("t-plus").addEventListener("click", function () { if (S.size < SIZES.length - 1) { S.size++; save(); applySize(); } });
  var autoBtn = document.getElementById("t-auto");
  autoBtn.setAttribute("aria-pressed", String(S.auto));
  autoBtn.addEventListener("click", function () {
    S.auto = !S.auto; save(); autoBtn.setAttribute("aria-pressed", String(S.auto));
  });

  function isDark() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t === "dark") return true;
    if (t === "light") return false;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function paintTheme() {
    var dark = isDark();
    var b = document.getElementById("t-theme");
    b.textContent = dark ? "الوضع النهاري" : "الوضع الليلي";
    b.setAttribute("aria-pressed", String(dark));
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#0D191E" : "#9A5A00");
  }
  document.getElementById("t-theme").addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("adhkar-theme", next); } catch (err) {}
    paintTheme();
  });

  var resetBtn = document.getElementById("t-reset"), armed = false, armTimer = null;
  function disarm() { armed = false; clearTimeout(armTimer); resetBtn.textContent = "إعادة القسم"; resetBtn.classList.remove("armed"); }
  resetBtn.addEventListener("click", function () {
    if (!armed) {
      armed = true;
      resetBtn.textContent = "اضغط للتأكيد";
      resetBtn.classList.add("armed");
      armTimer = setTimeout(disarm, 3000);
    } else {
      disarm();
      S[mode] = {};
      if (mode === "m" || mode === "e") S.shared = {};
      save();
      setMode(mode, 0);
    }
  });

  function openSheet() {
    var ul = document.getElementById("sheet-list");
    ul.textContent = "";
    document.getElementById("sheet-title").textContent = "فهرس " + MODE_NAME[mode];
    list.forEach(function (it, i) {
      var li = document.createElement("li");
      var b = el("button", "");
      b.type = "button";
      var name = el("span", "", ar(i + 1) + ". " + it.title);
      var st = el("span", "st", isFin(it) ? "تم" : ar(doneOf(it)) + " / " + ar(it.count));
      b.appendChild(name); b.appendChild(st);
      b.addEventListener("click", function () { closeSheet(); go(i, true); });
      li.appendChild(b);
      ul.appendChild(li);
    });
    sheet.hidden = false;
    document.getElementById("t-index").setAttribute("aria-expanded", "true");
    document.body.style.overflow = "hidden";
    document.getElementById("sheet-close").focus();
  }
  function closeSheet() {
    sheet.hidden = true;
    document.getElementById("t-index").setAttribute("aria-expanded", "false");
    document.body.style.overflow = "";
    document.getElementById("t-index").focus();
  }
  document.getElementById("t-index").addEventListener("click", openSheet);
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) {
      if (e.key === "Escape") closeSheet();
      return;
    }
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); go(cur + 1, true); }
    else if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); go(cur - 1, true); }
  });
  window.addEventListener("scroll", updateCur, { passive: true });
  window.addEventListener("resize", syncStick);

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (pos) {
      geo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      try { localStorage.setItem("adhkar-geo", JSON.stringify(geo)); } catch (err) {}
      var info = clockInfo();
      paintWhen(info);
      if (!userPicked && (mode === "m" || mode === "e") && info.mode !== mode) setMode(info.mode);
    }, function () { paintWhen(clockInfo()); }, { enableHighAccuracy: false, maximumAge: 6 * 3600 * 1000, timeout: 8000 });
  }

  applySize();
  paintTheme();
  paintWhen(info0);
  setMode(mode);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
