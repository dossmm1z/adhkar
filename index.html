<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكار الصباح والمساء</title>
<meta name="theme-color" content="#2D6A4F">
<meta name="description" content="أذكار الصباح والمساء وأدعية مختارة، بطاقات للقراءة والعدّ">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأذكار">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen reader. A segmented switch (morning / evening), a thin progress line,
   then a horizontal snap carousel of cards. Each card ends in one large tap target that counts down. */
:root {
  --bg: #EDF2F1;
  --card: #FFFFFF;
  --fg: #13232B;
  --muted: #586C73;
  --line: #D2DDDC;
  --morning: #9A5A00;
  --on-morning: #FFFFFF;
  --evening: #3A55A3;
  --on-evening: #FFFFFF;
  --selected: #2D6A4F;
  --on-selected: #FFFFFF;
  --accent: var(--morning);
  --on-accent: var(--on-morning);

  --f-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --f-title: "Reem Kufi", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --f-text: "Amiri", "Traditional Arabic", "Geeza Pro", "Noto Naskh Arabic", serif;
  --f-quran: "Amiri Quran", "Amiri", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D191E;
    --card: #15262D;
    --fg: #E7F0EF;
    --muted: #97ADB2;
    --line: #264049;
    --morning: #E6A94A;
    --on-morning: #1B1204;
    --evening: #8EA8F2;
    --on-evening: #0C1330;
    --selected: #7CC4A0;
    --on-selected: #0A1F15;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D191E;
  --card: #15262D;
  --fg: #E7F0EF;
  --muted: #97ADB2;
  --line: #264049;
  --morning: #E6A94A;
  --on-morning: #1B1204;
  --evening: #8EA8F2;
  --on-evening: #0C1330;
  --selected: #7CC4A0;
  --on-selected: #0A1F15;
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  direction: rtl;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
body[data-mode="evening"] { --accent: var(--evening); --on-accent: var(--on-evening); }
body[data-mode="selected"] { --accent: var(--selected); --on-accent: var(--on-selected); }

button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Mode switch */
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr 1.3fr;
  gap: 4px;
  padding: 4px;
  border-radius: 16px;
  background: color-mix(in srgb, var(--fg) 7%, var(--bg));
  flex: none;
}
.seg button {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 4px;
  border: 0; border-radius: 12px;
  background: transparent;
  color: var(--muted);
  font-weight: 600; font-size: 1rem;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Progress */
.prog { flex: none; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .8rem; }
.prog .track { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.prog .track i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.prog span { white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Carousel */
.carousel {
  direction: rtl;
  flex: 1; min-height: 0;
  display: flex; gap: 8px;
  padding-inline: 6%;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
}
.carousel::-webkit-scrollbar { display: none; }
.card {
  flex: 0 0 88%;
  min-width: 0;
  scroll-snap-align: center;
  scroll-snap-stop: always;
  display: flex; flex-direction: column; gap: 10px;
  padding: 16px 16px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
}
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); flex: none; }
.card-head .pos { font-variant-numeric: tabular-nums; }
.chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--accent); font-weight: 600; }
.only { margin-inline-start: auto; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent); font-weight: 600; }
.card h2 {
  margin: 0; flex: none;
  font-family: var(--f-title); font-weight: 700; font-size: 1.25rem; line-height: 1.5;
  color: var(--accent); text-align: center; text-wrap: balance;
}
.body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.text {
  margin: auto 0;
  padding: 4px 2px;
  font-family: var(--f-text); font-size: var(--reading, 1.6rem);
  line-height: 2.1; text-align: center; text-wrap: pretty;
}
.text.q { font-family: var(--f-quran); line-height: 2.3; }
.note { margin: 0; flex: none; font-size: .8rem; color: var(--muted); text-align: center; }

.foot { flex: none; display: flex; flex-direction: column; gap: 8px; }
.mini { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.mini i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
.row { display: flex; gap: 8px; }
.count {
  flex: 1; min-height: 68px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  border: 1px solid transparent; border-radius: 16px;
  background: var(--accent); color: var(--on-accent);
  cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  transition: transform .08s ease;
}
.count:active:not(:disabled) { transform: scale(.985); }
.count .lbl { font-size: .8rem; opacity: .92; }
.count .num { font-family: var(--f-title); font-weight: 700; font-size: 1.9rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.card.done .count, .count:disabled {
  background: color-mix(in srgb, var(--accent) 14%, var(--card));
  border-color: color-mix(in srgb, var(--accent) 45%, var(--card));
  color: var(--fg);
  cursor: default;
}
.undo {
  flex: none; width: 56px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 16px; background: transparent; color: var(--muted);
  cursor: pointer; touch-action: manipulation;
}
.undo:disabled { opacity: .35; cursor: default; }
.undo svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.card.end { justify-content: center; text-align: center; }
.card.end .text { font-size: 1.5rem; margin: 0; }

/* Tools */
.tools { flex: none; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tools button {
  min-height: 36px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 999px; background: transparent;
  color: var(--muted); font-size: .85rem; cursor: pointer; touch-action: manipulation;
}
.tools button[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); font-weight: 600; }
.tools button.armed { color: var(--fg); border-color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>

</head>
<body>
<h1 class="sr">أذكار الصباح والمساء</h1>

<div class="seg" role="group" aria-label="وقت الأذكار">
  <button type="button" id="b-m" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span>الصباح</span>
  </button>
  <button type="button" id="b-e" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    <span>المساء</span>
  </button>
  <button type="button" id="b-s" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
    <span>أدعية مختارة</span>
  </button>
</div>

<div class="prog" aria-live="polite">
  <div class="track"><i id="bar"></i></div>
  <span id="prog-txt"></span>
</div>

<div class="carousel" id="car" tabindex="-1" aria-label="بطاقات الأذكار"></div>

<div class="tools">
  <button type="button" id="t-minus" aria-label="تصغير الخط">أ −</button>
  <button type="button" id="t-plus" aria-label="تكبير الخط">أ +</button>
  <button type="button" id="t-auto" aria-pressed="true">تقدّم تلقائي</button>
  <button type="button" id="t-reset">إعادة</button>
</div>

<script>
(function () {
  document.documentElement.lang = "ar";
  document.documentElement.dir = "rtl";

  var DIG = "٠١٢٣٤٥٦٧٨٩";
  function ar(n) { return String(n).replace(/\d/g, function (d) { return DIG[d]; }); }
  function times(n) {
    if (n === 1) return "مرة واحدة";
    if (n === 2) return "مرتان";
    return n <= 10 ? ar(n) + " مرات" : ar(n) + " مرة";
  }

  /* when: b = صباح ومساء، m = الصباح فقط، e = المساء فقط */
  var ITEMS = [
    { id: "kursi", kind: "q", when: "b", count: 1, title: "آية الكرسي",
      note: "ثبت فضلها بعد الصلاة وعند النوم (البخاري)، أما تخصيصها بالصباح والمساء ففي حديث الترمذي ٢٨٧٩ وضعّفته الطبعة.",
      text: `﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾` },
    { id: "ikhlas", kind: "q", when: "b", count: 3, title: "سورة الإخلاص",
      note: "أبو داود ٥٠٨٢ (مع المعوذتين ثلاثًا) وحكمه: حسن.",
      text: `﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾` },
    { id: "falaq", kind: "q", when: "b", count: 3, title: "سورة الفلق",
      text: `﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾` },
    { id: "nas", kind: "q", when: "b", count: 3, title: "سورة الناس",
      text: `﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ﴾` },
    { id: "baqara", kind: "q", when: "e", count: 1, title: "آخر سورة البقرة",
      note: "الآيتان الأخيرتان، وتُقرآن في المساء أو الليل.",
      text: `﴿آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ﴾` },
    { id: "sayyid", kind: "d", when: "b", count: 1, title: "سيد الاستغفار",
      note: "صحيح البخاري ٦٣٠٦ عن شداد بن أوس.",
      text: `اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك عليَّ، وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت` },
    { id: "mulk", kind: "d", when: "b", count: 1, title: "إفراد الملك والاستعاذة",
      text: {
        m: `أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، ربِّ أسألك خير ما في هذا اليوم وخير ما بعده، وأعوذ بك من شر ما في هذا اليوم وشر ما بعده، ربِّ أعوذ بك من الكسل وسوء الكبر، ربِّ أعوذ بك من عذاب في النار وعذاب في القبر`,
        e: `أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، ربِّ أسألك خير ما في هذه الليلة وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة وشر ما بعدها، ربِّ أعوذ بك من الكسل وسوء الكبر، ربِّ أعوذ بك من عذاب في النار وعذاب في القبر` } },
    { id: "isbah", kind: "d", when: "b", count: 1, title: "ذكر الإصباح والإمساء",
      text: {
        m: `اللهم بك أصبحنا، وبك أمسينا، وبك نحيا، وبك نموت، وإليك النشور`,
        e: `اللهم بك أمسينا، وبك أصبحنا، وبك نحيا، وبك نموت، وإليك المصير` } },
    { id: "khair", kind: "d", when: "b", count: 1, title: "سؤال خير اليوم والليلة",
      note: "أبو داود ٥٠٨٤، وفي الطبعة حكم عليه بالضعف.",
      text: {
        m: `أصبحنا وأصبح الملك لله رب العالمين، اللهم إني أسألك خير هذا اليوم: فتحه، ونصره، ونوره، وبركته، وهداه، وأعوذ بك من شر ما فيه وشر ما بعده`,
        e: `أمسينا وأمسى الملك لله رب العالمين، اللهم إني أسألك خير هذه الليلة: فتحها، ونصرها، ونورها، وبركتها، وهداها، وأعوذ بك من شر ما فيها وشر ما بعدها` } },
    { id: "fitra", kind: "d", when: "b", count: 1, title: "ذكر الفطرة",
      text: {
        m: `أصبحنا على فطرة الإسلام، وعلى كلمة الإخلاص، وعلى دين نبينا محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم حنيفاً مسلماً وما كان من المشركين`,
        e: `أمسينا على فطرة الإسلام، وعلى كلمة الإخلاص، وعلى دين نبينا محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم حنيفاً مسلماً وما كان من المشركين` } },
    { id: "afw", kind: "d", when: "b", count: 1, title: "سؤال العفو والعافية والحفظ",
      text: `اللهم إني أسألك العفو والعافية في الدنيا والآخرة، اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي، اللهم استر عوراتي، وآمن روعاتي، اللهم احفظني من بين يديَّ، ومن خلفي، وعن يميني، وعن شمالي، ومن فوقي، وأعوذ بعظمتك أن أُغتال من تحتي` },
    { id: "shirk", kind: "d", when: "b", count: 1, title: "الحماية من الشرك والشرور",

  ];

  /* ---------- state ---------- */
  var KEY = "adhkar-cards-v1";
  var SIZES = [1.2, 1.4, 1.6, 1.85, 2.15];
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  var S = { day: today(), size: 2, auto: true, m: {}, e: {}, s: {} };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && typeof saved === "object") {
      if (typeof saved.size === "number") S.size = Math.max(0, Math.min(SIZES.length - 1, saved.size));
      if (typeof saved.auto === "boolean") S.auto = saved.auto;
      if (saved.day === S.day) { S.m = saved.m || {}; S.e = saved.e || {}; S.s = saved.s || {}; }
    }
  } catch (err) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (err) {} }

  var mode = new Date().getHours() < 15 ? "m" : "e";
  var list = [], cards = [], cur = 0, io = null;
  var car = document.getElementById("car");
  var smooth = !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function doneOf(it) { return Math.min(S[mode][it.id] || 0, it.count); }
  function isFin(it) { return doneOf(it) >= it.count; }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (err) {} }
  function svgUndo() {
    var ns = "http://www.w3.org/2000/svg";
    var s = document.createElementNS(ns, "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    ["M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8", "M3 3v5h5"].forEach(function (d) {
      var p = document.createElementNS(ns, "path"); p.setAttribute("d", d); s.appendChild(p);
    });
    return s;
  }

  /* ---------- build ---------- */
  function build() {
    list = ITEMS.filter(function (it) { return it.when === mode || (mode !== "s" && it.when === "b"); });
    car.textContent = "";
    cards = [];
    var total = list.length;

    list.forEach(function (it, i) {
      var card = el("article", "card");
      card.setAttribute("aria-label", it.title);

      var head = el("div", "card-head");
      head.appendChild(el("span", "pos", ar(i + 1) + " / " + ar(total)));
      head.appendChild(el("span", "chip", times(it.count)));
      if (it.when === "m" || it.when === "e") head.appendChild(el("span", "only", it.when === "m" ? "للصباح فقط" : "للمساء فقط"));
      card.appendChild(head);

      card.appendChild(el("h2", "", it.title));

      var body = el("div", "body");
      var raw = typeof it.text === "string" ? it.text : it.text[mode];
      body.appendChild(el("p", "text" + (it.kind === "q" ? " q" : ""), it.kind === "q" ? raw : "«" + raw + "»"));
      card.appendChild(body);
      if (it.note) card.appendChild(el("p", "note", it.note));

      var foot = el("div", "foot");
      var mini = el("div", "mini"); mini.appendChild(document.createElement("i"));
      var row = el("div", "row");
      var btn = el("button", "count"); btn.type = "button";
      btn.appendChild(el("span", "lbl")); btn.appendChild(el("span", "num"));
      var undo = el("button", "undo"); undo.type = "button";
      undo.setAttribute("aria-label", "تراجع عن آخر عدّة");
      undo.appendChild(svgUndo());
      row.appendChild(btn); row.appendChild(undo);
      foot.appendChild(mini); foot.appendChild(row);
      card.appendChild(foot);

      btn.addEventListener("click", function () { tap(it, i); });
      undo.addEventListener("click", function () { untap(it); });

      car.appendChild(card);
      cards.push(card);
      paint(i);
    });

    /* closing card */
    var end = el("article", "card end");
    end.setAttribute("aria-label", "الختام");
    end.appendChild(el("h2", "", "الختام"));
    var et = el("p", "text", ""); et.id = "end-text";
    end.appendChild(et);
    var eb = el("button", "count"); eb.type = "button"; eb.id = "end-btn";
    eb.appendChild(el("span", "num", "أول ذكر ناقص"));
    eb.addEventListener("click", function () { go(firstOpen(), smooth); });
    end.appendChild(eb);
    car.appendChild(end);
    cards.push(end);

    if (io) io.disconnect();
    if ("IntersectionObserver" in window) {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) cur = cards.indexOf(e.target);
        });
      }, { root: car, threshold: 0.6 });
      cards.forEach(function (c) { io.observe(c); });
    }
    progress();
  }

  function paint(i) {
    var it = list[i], card = cards[i];
    if (!it || !card) return;
    var d = doneOf(it), fin = d >= it.count;
    var btn = card.querySelector(".count"), undo = card.querySelector(".undo");
    var lbl = btn.querySelector(".lbl"), num = btn.querySelector(".num");
    card.classList.toggle("done", fin);
    card.querySelector(".mini i").style.width = (d / it.count * 100) + "%";
    btn.disabled = fin;
    undo.disabled = d === 0;
    if (fin) {
      lbl.textContent = ""; lbl.hidden = true; num.textContent = "✓ تمّت";
    } else if (it.count === 1) {
      lbl.hidden = false; lbl.textContent = "اضغط بعد القراءة"; num.textContent = "تمّت";
    } else {
      lbl.hidden = false; lbl.textContent = "المتبقي من " + ar(it.count); num.textContent = ar(it.count - d);
    }
  }

  function progress() {
    var total = list.length, n = list.filter(isFin).length;
    document.getElementById("bar").style.width = (total ? n / total * 100 : 0) + "%";
    document.getElementById("prog-txt").textContent = "اكتمل " + ar(n) + " من " + ar(total);
    var rem = total - n;
    var et = document.getElementById("end-text"), eb = document.getElementById("end-btn");
    if (!et) return;
    if (rem === 0) {
      et.textContent = mode === "s" ? "تقبّل الله منك. أتممت الأدعية المختارة بحمد الله." : "تقبّل الله منك. أتممت أذكار " + (mode === "m" ? "الصباح" : "المساء") + " بحمد الله.";
      eb.hidden = true;
    } else {
      et.textContent = "لم يكتمل بعد: " + ar(rem) + " من " + ar(total);
      eb.hidden = false;
    }
  }

  function firstOpen() {
    for (var i = 0; i < list.length; i++) if (!isFin(list[i])) return i;
    return list.length;
  }

  function go(i, sm) {
    i = Math.max(0, Math.min(cards.length - 1, i));
    cur = i;
    cards[i].scrollIntoView({ behavior: sm ? "smooth" : "auto", inline: "center", block: "nearest" });
  }

  /* ---------- actions ---------- */
  function tap(it, i) {
    var d = doneOf(it);
    if (d >= it.count) return;
    S[mode][it.id] = d + 1;
    save(); paint(i); progress();
    if (d + 1 >= it.count) {
      buzz([12, 40, 12]);
      if (S.auto) setTimeout(function () { if (cur === i) go(i + 1, smooth); }, 380);
    } else {
      buzz(8);
    }
  }
  function untap(it) {
    var d = doneOf(it);
    if (d <= 0) return;
    S[mode][it.id] = d - 1;
    save(); paint(list.indexOf(it)); progress();
  }

  function setMode(m, startAt) {
    mode = m;
    document.body.setAttribute("data-mode", m === "e" ? "evening" : m === "s" ? "selected" : "morning");
    document.getElementById("b-s").setAttribute("aria-pressed", String(m === "s"));
    document.getElementById("b-m").setAttribute("aria-pressed", String(m === "m"));
    document.getElementById("b-e").setAttribute("aria-pressed", String(m === "e"));
    build();
    requestAnimationFrame(function () { go(startAt == null ? firstOpen() : startAt, false); });
  }
  document.getElementById("b-m").addEventListener("click", function () { if (mode !== "m") setMode("m"); });
  document.getElementById("b-e").addEventListener("click", function () { if (mode !== "e") setMode("e"); });
  document.getElementById("b-s").addEventListener("click", function () { if (mode !== "s") setMode("s"); });

  /* tools */
  function applySize() {
    document.documentElement.style.setProperty("--reading", SIZES[S.size] + "rem");
    document.getElementById("t-minus").disabled = S.size === 0;
    document.getElementById("t-plus").disabled = S.size === SIZES.length - 1;
  }
  document.getElementById("t-minus").addEventListener("click", function () { if (S.size > 0) { S.size--; save(); applySize(); } });
  document.getElementById("t-plus").addEventListener("click", function () { if (S.size < SIZES.length - 1) { S.size++; save(); applySize(); } });
  var autoBtn = document.getElementById("t-auto");
  autoBtn.setAttribute("aria-pressed", String(S.auto));
  autoBtn.addEventListener("click", function () {
    S.auto = !S.auto; save(); autoBtn.setAttribute("aria-pressed", String(S.auto));
  });
  var resetBtn = document.getElementById("t-reset"), armed = false, armTimer = null;
  function disarm() { armed = false; clearTimeout(armTimer); resetBtn.textContent = "إعادة"; resetBtn.classList.remove("armed"); }
  resetBtn.addEventListener("click", function () {
    if (!armed) {
      armed = true;
      resetBtn.textContent = "اضغط للتأكيد";
      resetBtn.classList.add("armed");
      armTimer = setTimeout(disarm, 3000);
    } else {
      disarm();
      S[mode] = {};
      save();
      setMode(mode, 0);
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { go(cur + 1, smooth); }
    else if (e.key === "ArrowRight") { go(cur - 1, smooth); }
  });

  applySize();
  setMode(mode);
})();
</script>
